<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VinFlow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <style>
    /* Paksa warna solid di balik layar agar tidak transparan */
    html, body {
      background-color: #F8FAFC !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    /* Trik agar elemen tidak hilang saat di-scroll di iPhone */
    canvas {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
  </style>
</head>
<body>
  <script>
    // MATIKAN SERVICE WORKER (Penyebab utama lag & glitch di Chrome iOS)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // PAKSA RENDERER KE HTML (Tanpa kompromi)
    window.flutterWebRenderer = "html";
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
