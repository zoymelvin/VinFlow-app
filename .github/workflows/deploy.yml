name: Deploy VinFlow to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          # 1. Bersihkan sisa build lama agar tidak ada file sampah
          flutter clean
          flutter pub get
          
          # 2. LOGIKA UTAMA: Build tanpa PWA (--pwa-strategy=none) 
          # Ini kunci agar Chrome iPhone tidak menyimpan cache render yang rusak/abu-abu
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-tree-shake-icons --pwa-strategy=none

      - name: Post Build Fix
        run: |
          # 3. Double Check: Pastikan file service worker benar-benar tidak ada
          # agar browser dipaksa mengambil aset visual (Indigo & Header) yang paling segar
          rm -f build/web/flutter_service_worker.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages